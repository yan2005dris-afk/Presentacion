<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMD y Arquitecturas Paralelas — Exposición</title>
    <!-- KaTeX CDN para renderizado matemático vectorial impecable -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGExxAU4wnrvtv2XYPA4AkdeBch5+4" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaplc9nxex4K62sTrrQU39pq5Prb92drPYsasty" crossorigin="anonymous"></script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var t = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var resolved = t === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.classList.add(resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
